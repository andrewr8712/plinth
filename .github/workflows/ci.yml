# CI for Plinth.
#
# The same commands run locally:
#   ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
#
# The instrumented suite is deliberately not here: it needs a device and is
# verified on the tablet (see HANDOFF.md). This workflow is the clean-runner
# gate for the JVM tests, lint and the debug APK.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test, lint, assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Pinned to an immutable commit rather than a mutable tag. Bump it
      # deliberately; Dependabot can propose the update and rewrite the pin.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu runner image already carries the Android SDK and sdkmanager.
      # Install the two packages the app needs explicitly; setup-android's own
      # legacy 'tools' step fails against the current SDK repository.
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4

      - name: Test, lint and assemble
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: plinth-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: lint-results-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
